# Marketplace (type marketplace): many sellers, one catalog, customers buy from several sellers in one cart.
# Each seller is a workspace with its own staff; a cart is split into one order per seller at checkout.
app:
  name: Bozor
  slug: bozor-market
  description: Thousands of products from local sellers, delivered to your door.
  type: marketplace
  style: market
  color: violet
  appId: uz.bozor.market
  currency: UZS

